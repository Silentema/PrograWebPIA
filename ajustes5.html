<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios que bloqueaste</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, Roboto, Helvetica, sans-serif;
            background-color: #ffffff;
            padding: 20px;
            color: #222;
        }

        .blocked-users-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        .blocked-users-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .user-card {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            padding: 15px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .user-card:hover {
            background-color: #f9f9f9;
        }

        .user-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            color: #222;
        }

        .user-handle {
            font-size: 20px;
            font-weight: 300;
            color: #777;
        }

        .user-bio {
            font-size: 20px;
            font-weight: 400;
            color: #777;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .block-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .block-icon:hover {
            opacity: 0.7;
        }

        .block-icon svg {
            width: 17px;
            height: 17px;
            fill: #FF5050;
        }

        .block-button {
            padding: 9px 26px;
            border: none;
            border-radius: 67px;
            background-color: #FF5050;
            color: #FFF;
            font-family: 'Montserrat', -apple-system, Roboto, Helvetica, sans-serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .block-button:hover {
            background-color: #ff3c3c;
        }

        .block-button:active {
            transform: scale(0.98);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .title {
                font-size: 18px;
                margin-bottom: 30px;
                margin-top: 15px;
            }

            .user-card {
                flex-wrap: wrap;
                gap: 15px;
            }

            .user-name,
            .user-handle,
            .user-bio {
                font-size: 16px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }

            .user-info {
                flex-basis: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .title {
                font-size: 16px;
                margin-bottom: 25px;
            }

            .user-card {
                gap: 12px;
            }

            .user-avatar {
                width: 48px;
                height: 48px;
            }

            .user-name,
            .user-handle,
            .user-bio {
                font-size: 14px;
            }

            .block-button {
                font-size: 16px;
                padding: 8px 20px;
            }

            .block-icon svg {
                width: 15px;
                height: 15px;
            }
        }
    </style>
</head>
